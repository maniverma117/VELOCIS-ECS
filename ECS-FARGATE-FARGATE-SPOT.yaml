AWSTemplateFormatVersion: '2010-09-09'

Description: CloudFormation template to create ECS Fargate cluster with Service Discovery namespace.

Parameters:

  NamespaceName:
    Type: String
    Description: Private DNS namespace name

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for service discovery namespace

  ClusterName:
    Type: String
    Description: ECS Cluster Name

Resources:

  PrivateDnsNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref NamespaceName
      Vpc: !Ref VpcId
      Description: Private DNS namespace for ECS services
      Properties:
        DnsProperties:
          SOA:
            TTL: 60
      Tags:
        - Key: Name
          Value: !Ref NamespaceName

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

      ClusterSettings:
        - Name: containerInsights
          Value: enabled

      Configuration:
        ExecuteCommandConfiguration:
          Logging: OVERRIDE
          LogConfiguration:
            CloudWatchLogGroupName: ecs-log-group
            CloudWatchEncryptionEnabled: true

      ServiceConnectDefaults:
        Namespace: !Ref NamespaceName

Outputs:

  NamespaceId:
    Description: Service Discovery Namespace ID
    Value: !Ref PrivateDnsNamespace

  ClusterArn:
    Description: ECS Cluster ARN
    Value: !Ref EcsCluster